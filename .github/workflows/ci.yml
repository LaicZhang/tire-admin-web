name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oxlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node 26 不再随发行版分发 Corepack（`corepack enable` 会 not found），
      # 改由 pnpm/action-setup 按 package.json 的 packageManager(pnpm@12.10.1) 安装。
      # 必须先于 setup-node：下一步的 cache: pnpm 需要 pnpm 已在 PATH。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Oxlint (advisory during migration)
        run: pnpm lint:oxlint:check
        continue-on-error: true

  web-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node 26 不再随发行版分发 Corepack（`corepack enable` 会 not found），
      # 改由 pnpm/action-setup 按 package.json 的 packageManager(pnpm@12.10.1) 安装。
      # 必须先于 setup-node：下一步的 cache: pnpm 需要 pnpm 已在 PATH。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure no real .env files are tracked
        run: |
          bad=$(git ls-files -- .env* | grep -vE '\.example$' || true)
          if [ -n "$bad" ]; then
            echo "Tracked .env files found (should be .env*.example only):"
            echo "$bad"
            exit 1
          fi

      - name: Dependency audit (block on critical)
        run: pnpm audit --audit-level=critical

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint:check

      - name: Unit tests
        run: pnpm test

      - name: Install Playwright Chromium (mock e2e)
        run: pnpm exec playwright install --with-deps chromium

      - name: Mock E2E (Playwright)
        run: pnpm test:e2e

      - name: Build (staging)
        run: pnpm build --mode staging

      - name: Build (production)
        run: pnpm build --mode production
